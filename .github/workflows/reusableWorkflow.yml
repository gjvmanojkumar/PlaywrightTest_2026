name: Reusable - Merge Reports & Notify
on:  #We use workflow_call to make this workflow accessible in another workflows
    workflow_call:
        inputs:
            artifact_name:
                description: 'Pattern for blob artifacts'
                required: false
                default: dist
                type: string
            node-version:
                description: 'Define Node version'
                required: true
                type: string
                default: '24'
            retentionDays:
                required: false
                type: number
                default: 30

        outputs:
            report-url:
                description: 'Download URL of merged report'
                value: ${{ jobs.merge-report.outputs.url }}
jobs:
    merge-report:
        runs-on: ubuntu-latest
        outputs:
            url: ${{ steps.upload.outputs.artifact-url }}
        steps:
           - uses: actions/checkout@v6

           - name: Download all blob reports
             uses: actions/download-artifact@v7
             with:
                path: all-blob-reports/
                pattern: ${{ inputs.artifact_name }}-*
                merge-multiple: true

           - name: Convert to HTML report
             run: npx playwright merge-reports --reporter=html ./all-blob-reports

           - name: Upload merged reports
             id: upload
             uses: actions/upload-artifact@v4.6.2
             if: ${{ !cancelled() }}
             with:
                path: playwright-report/
                retention-days: ${{ inputs.retentionDays }}

           - name: Upload to Microsoft Playwright Portal
             uses: microsoft/playwright-github-action@v1
             with:
                github-token: ${{ secrets.GITHUB_TOKEN }}

           - name: Upload to Allure TestOps
             run: |
                npx allure generate ./allure-results --clean
           # upload to Allure TestOps via their CLI
             env:
                ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT }}
                ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
                ALLURE_PROJECT_ID: ${{ secrets.ALLURE_PROJECT_ID }}
