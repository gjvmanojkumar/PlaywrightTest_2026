name: Reusable - Merge Reports & Notify
on:  #We use workflow_call to make this workflow accessible in another workflows
    workflow_call:
        inputs:
            artifact_name:
                description: 'Pattern for blob artifacts'
                required: false
                default: 'all-blob-reports'
                type: string
            node-version:
                description: 'Define Node version'
                required: true
                type: string
                default: '24'
            retentionDays:
                required: false
                type: number
                default: 30

        outputs:
            allure-report-url:                                        # ① workflow output — Allure
                description: 'Artifact URL of Allure report'
                value: ${{ jobs.merge-report.outputs.allure-url }}
            html-report-url:                                          # ② workflow output — HTML
                description: 'Artifact URL of HTML report'
                value: ${{ jobs.merge-report.outputs.html-url }}
            pages-url:                                                # ③ workflow output — live Pages URL
                description: 'Live GitHub Pages URL'
                value: 'https://gjvmanojkumar.github.io/PlaywrightTest_2026/latest/'
            passed:                                                  
                value: ${{ jobs.merge-report.outputs.passed }}
            failed:                                                  
                value: ${{ jobs.merge-report.outputs.failed }}
            flaky:
                value: ${{ jobs.merge-report.outputs.flaky }}
            skipped:                                                 
                value: ${{ jobs.merge-report.outputs.skipped }}
            total:                                                   
                value: ${{ jobs.merge-report.outputs.total }}

jobs:
    merge-report:
        runs-on: ubuntu-latest
        outputs:
            allure-url: ${{ steps.allure-upload.outputs.artifact-url }}
            html-url: ${{ steps.html-upload.outputs.artifact-url }}
            passed: ${{ steps.counts.outputs.passed }}
            failed: ${{ steps.counts.outputs.failed }}
            flaky: ${{ steps.counts.outputs.flaky }}
            skipped: ${{ steps.counts.outputs.skipped }}
            total: ${{ steps.counts.outputs.total }}
        steps:
           - uses: actions/checkout@v4
             with:
                persist-credentials: true

           - name: Load & Cache Deps
             uses: ./.github/actions/cached-deps
             with:
                caching: 'true'
                node-version: ${{ inputs.node-version }}

           - name: Download all blob reports
             uses: actions/download-artifact@v7
             with:
                path: all-blob-reports/
                pattern: ${{ inputs.artifact_name }}-*
                merge-multiple: true

           - name: Convert to HTML report
             run: npx playwright merge-reports --reporter=html ./all-blob-reports

           - name: Upload merged reports
             id: html-upload
             uses: actions/upload-artifact@v4.6.2
             with:
                path: playwright-report/
                retention-days: 7

            # Generating the Allure report from Blob reports generated
           - name: Merge into Allure Results
             run: npx playwright merge-reports --reporter=allure-playwright ./all-blob-reports

           - name: Extract counts from HTML report
             id: counts
             run: |
                REPORT="./playwright-report/report.json"
                PASSED=$(jq '.stats.expected'   $REPORT 2>/dev/null || echo 0)
                FAILED=$(jq '.stats.unexpected' $REPORT 2>/dev/null || echo 0)
                FLAKY=$(jq '.stats.flaky'       $REPORT 2>/dev/null || echo 0)
                SKIPPED=$(jq '.stats.skipped'   $REPORT 2>/dev/null || echo 0)
                TOTAL=$(jq '.stats.total'       $REPORT 2>/dev/null || echo 0)
                echo "passed=$PASSED"   >> $GITHUB_OUTPUT
                echo "failed=$FAILED"   >> $GITHUB_OUTPUT
                echo "flaky=$FLAKY"     >> $GITHUB_OUTPUT
                echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
                echo "total=$TOTAL"     >> $GITHUB_OUTPUT

           - name: Generate Allure HTML Report
             run: npx allure generate ./allure-results --clean -o ./allure-report

           - name: Upload Allure Report
             id: allure-upload
             uses: actions/upload-artifact@v4.6.2
             if: ${{ !cancelled() }}
             with:
                name: allure-report
                path: allure-report/
                retention-days: ${{ inputs.retentionDays }}

           - name: Deploy Allure to GitHub Pages
             uses: peaceiris/actions-gh-pages@v3
             with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./allure-report
                destination_dir: latest
                keep_files: false